name: Upbit Learn Pattern

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-learner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 최신 커밋 이력을 안전하게 Rebase하기 위해 fetch-depth 설정
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pattern Learner
        run: |
          python learn_pattern.py

      - name: Commit and push learned golden pattern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # data 폴더 전체 또는 변경된 결과 파일 스테이징
          git add data/
          
          # Staged 영역에 변경 사항이 있는지 정확히 체크
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Update golden pattern & history data [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in data/ directory. Skipping commit."
          fi
